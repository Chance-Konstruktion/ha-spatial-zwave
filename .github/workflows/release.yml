name: Release

# Builds the HACS download artifact (spatial_zwave.zip, as declared in
# hacs.json) from the integration directory and attaches it to the release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Build & attach spatial_zwave.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build spatial_zwave.zip
        run: |
          cd custom_components/spatial_zwave
          zip -r ../../spatial_zwave.zip . -x '*__pycache__*'
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: spatial_zwave.zip
