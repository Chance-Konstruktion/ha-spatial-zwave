name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * 1"  # weekly, Monday 04:30 UTC

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # `brands` wants this integration's icon to exist in the
          # home-assistant/brands repository, which is a pull request over
          # there rather than anything this repository can satisfy. It is
          # a requirement for being listed in HACS by default, and none at
          # all for installing this as a custom repository -- which is the
          # only way it is offered today. Drop this line the day the brands
          # PR is merged, and not before, so the check means something.
          ignore: brands

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
